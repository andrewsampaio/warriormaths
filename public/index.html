<body>

<style>
/* Layout: full-screen 3D forest; HUD on top, joystick bottom-left, actions bottom-right, story/problem sheet slides up from bottom. Single dusk world by design. */
:root{
  --night:#0c1514; --canopy:#152321; --card:rgba(20,33,31,.94); --line:#2f4741;
  --moss:#86b07c; --star:#f3d68c; --ink:#eef2ea; --mute:#a7bab0;
  --ember:#ec8c64; --ok:#9ad48f;
  --display:"Grenze", Georgia, serif;
  --body:"Atkinson Hyperlegible", system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(10,8,14,.55) 100%)}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2rem;color:var(--star)} h2{font-size:1.5rem;color:var(--star)} h3{font-size:1.15rem}
p{margin:0}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--mute)}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;display:flex;gap:8px;align-items:center;pointer-events:none;font-variant-numeric:tabular-nums}
#hud .pill{pointer-events:auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:rgba(12,21,20,.7);border:1px solid var(--line);font-size:.9rem;backdrop-filter:blur(4px)}
.pill b{font-family:var(--display);font-size:1.25rem;color:var(--star)}
#cam,#menu{pointer-events:auto;font:700 .95rem var(--body);color:var(--ink);background:rgba(12,21,20,.7);border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
#cam{margin-left:auto}#cam svg{width:18px;height:18px;flex:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.seg .opt{text-align:center;padding:10px 6px;font-size:.92rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 62px);width:min(520px,calc(100% - 32px));pointer-events:none}
#joy{position:fixed;left:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:124px;height:124px;border-radius:50%;background:rgba(12,21,20,.35);border:2px solid rgba(243,214,140,.35);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(243,214,140,.75);box-shadow:0 0 18px rgba(243,214,140,.4)}
#joy small{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:.7rem;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
#act{position:fixed;right:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);min-width:112px;height:112px;border-radius:56px;border:0;background:var(--star);color:#1b1608;font:700 1.35rem var(--display);padding:0 18px;cursor:pointer;box-shadow:0 0 0 6px rgba(243,214,140,.25),0 0 30px rgba(243,214,140,.45)}
#jump{position:fixed;right:30px;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);width:64px;height:64px;border-radius:50%;border:1px solid var(--line);background:rgba(12,21,20,.6);color:var(--ink);font:700 .78rem var(--body);cursor:pointer}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:74%;overflow:auto;background:var(--card);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);backdrop-filter:blur(6px);-webkit-user-select:text;user-select:text}
#sheet>.in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#intro{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:linear-gradient(transparent 30%,rgba(8,10,14,.75))}
#intro .card{max-width:560px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.story p+p{margin-top:8px}
.btn{font:700 1.05rem var(--body);border:0;border-radius:12px;padding:14px 18px;background:var(--star);color:#1b1608;cursor:pointer;min-height:52px;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--moss);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 0;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.link{background:none;border:0;color:var(--mute);font:.9rem var(--body);text-decoration:underline;cursor:pointer;padding:6px 0}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.track div{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;text-align:center;padding-top:7px;border-top:4px solid var(--line);color:var(--mute)}
.track div.on{border-color:var(--star);color:var(--star)}.track div.done{border-color:var(--moss);color:var(--moss)}
.problem{font-size:1.06rem;line-height:1.75}
.chip{font:700 1.05rem var(--body);font-variant-numeric:tabular-nums;border:2px dashed var(--mute);background:transparent;color:var(--ink);border-radius:8px;padding:0 7px;margin:0 2px;cursor:pointer;line-height:1.6}
.chip.sel{border-style:solid;border-color:var(--star);background:var(--star);color:#1b1608}
.num{font-weight:700;color:var(--star);font-variant-numeric:tabular-nums}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:1rem var(--body);text-align:left;border:1px solid var(--line);background:var(--canopy);color:var(--ink);border-radius:12px;padding:13px 14px;cursor:pointer;min-height:50px}
.opt.bad{border-color:var(--ember);opacity:.6}
.opt.pick{border-color:var(--star);color:var(--star)}
.mentor{background:rgba(21,35,33,.92);border-radius:14px;padding:11px 14px;border-left:4px solid var(--moss)}
.mentor.warn{border-left-color:var(--ember)}.mentor.good{border-left-color:var(--ok)}
.mentor .who{font-family:var(--display);color:var(--moss);font-size:1.02rem}
.mentor p{font-size:.97rem}
.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.op{font:700 1.6rem var(--display);border:1px solid var(--line);background:var(--canopy);color:var(--ink);border-radius:12px;min-height:56px;cursor:pointer}
.op.bad{border-color:var(--ember);color:var(--ember)}
.answer{display:flex;gap:10px}
.answer input{flex:1;min-width:0;font:700 1.4rem var(--body);font-variant-numeric:tabular-nums;background:var(--night);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 14px}
.answer .btn{width:auto}
.notes{display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.notes div{display:flex;justify-content:space-between;gap:10px;font-size:.93rem;color:var(--mute);border-bottom:1px dotted var(--line);padding-bottom:4px}
.notes b{color:var(--ok)}
.expr{font:700 1.3rem var(--body);color:var(--star);font-variant-numeric:tabular-nums}
details.ref summary{cursor:pointer;color:var(--mute);font-size:.9rem}
details.ref p{margin-top:8px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--canopy);display:flex;flex-direction:column;gap:7px;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.item .sw{height:26px;border-radius:8px;border:1px solid var(--line)}
.item small{color:var(--mute)}.item.worn{border-color:var(--star)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar label{display:flex;justify-content:space-between;gap:8px;font-size:.93rem;font-variant-numeric:tabular-nums}
.bar .t{height:10px;border-radius:5px;background:var(--canopy);overflow:hidden;margin-top:4px}
.bar .f{height:100%;background:var(--moss)}.bar.low .f{background:var(--ember)}
input.name{font:700 1.2rem var(--body);background:var(--night);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.names{display:flex;flex-wrap:wrap;gap:8px}.names .opt{flex:1 1 40%;text-align:center}
.kind{display:flex;flex-direction:column;gap:6px}
.swrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.sw2{flex:none;display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--canopy);color:var(--ink);font:600 .95rem var(--body);cursor:pointer;min-height:44px}
.sw2 i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.3)}
.sw2 small{color:var(--mute);font-weight:400}
.sw2.pick{border-color:var(--star);box-shadow:inset 0 0 0 1px var(--star)}
#sheet.half{max-height:52%}
#intro .card{max-height:58vh;overflow:auto}
.pill{padding:5px 10px}
#hud .pill small{color:var(--mute);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
#cam{padding:8px 10px}
.chip.struck{text-decoration:line-through;opacity:.35;border-style:dotted;cursor:default}
.disp{flex:1;min-width:0;font:700 1.6rem var(--body);font-variant-numeric:tabular-nums;background:var(--night);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px 14px;min-height:54px;display:flex;align-items:center}
.disp.err{border-color:var(--ember)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{font:700 1.45rem var(--body);min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--canopy);color:var(--ink);cursor:pointer}
.key.wide{grid-column:span 2}
.key.go{background:var(--star);color:#1b1608;border:0;font-size:1.15rem}
#meter{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;display:flex;align-items:center;gap:10px;pointer-events:none;font:700 .95rem var(--display)}
#meter span{min-width:0;flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30%;text-shadow:0 1px 4px #000}
#meter .mt{flex:1;height:16px;border-radius:8px;background:#5a2d22;border:1px solid var(--line);position:relative;overflow:hidden}
#meter .mf{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--moss),var(--star));transition:width .35s ease}
#meter i{position:absolute;top:-2px;bottom:-2px;left:50%;width:2px;background:#fff8}
.mapwrap{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#101c1a}
.mapwrap svg{display:block;width:100%;height:auto}
.terrs{display:flex;flex-direction:column;gap:8px}
.terr{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--canopy);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;cursor:pointer;min-height:56px}
.terr:disabled{opacity:.5;cursor:default}
.terr .dot{width:14px;height:14px;border-radius:50%;flex:none}
.terr div{flex:1;min-width:0}.terr small{display:block;color:var(--mute);font-size:.85rem}
.terr .st{flex:none;font-size:.85rem;color:var(--mute)}
.terr.here{border-color:var(--star)}
.rank{display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.rank div{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:8px;background:var(--canopy)}
.rank div.me{outline:1px solid var(--star);color:var(--star)}
.recruits{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.rc{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--canopy);font-size:.9rem}
.rc b{font-family:var(--display);font-size:1.1rem;color:var(--star);display:block}
.rc.off{opacity:.45}
@media (prefers-reduced-motion:reduce){#meter .mf{transition:none}}
#cine{position:fixed;inset:0;z-index:20;cursor:pointer}
#cine .bar{position:absolute;left:0;right:0;height:9vh;background:#000}
#cine .bar.top{top:0}#cine .bar.bot{bottom:0}
#fade{position:absolute;inset:0;background:#000;pointer-events:none}
#cap{position:absolute;left:16px;right:16px;bottom:calc(9vh + 18px);margin:0 auto;max-width:640px;text-align:center;font:500 clamp(1.25rem,4.6vw,1.9rem)/1.3 var(--display);color:#f6efe0;text-shadow:0 2px 12px #000,0 0 3px #000;opacity:0;text-wrap:balance}
#cap b{color:var(--star);font-weight:700}
#cap.in{animation:capIn 1s ease forwards}
@keyframes capIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#ctitle{position:absolute;left:16px;right:16px;top:30%;text-align:center;font-size:clamp(2.6rem,11vw,5rem);line-height:.95;color:var(--star);text-shadow:0 0 30px rgba(243,214,140,.55),0 3px 10px #000;animation:capIn 2s ease forwards}
#skip{position:absolute;right:14px;top:calc(9vh + 10px);font:700 .9rem var(--body);color:var(--ink);background:rgba(0,0,0,.45);border:1px solid #fff4;border-radius:999px;padding:8px 14px;cursor:pointer}
.land{height:14px;border-radius:7px;overflow:hidden;display:flex;border:1px solid var(--line)}
.land span{height:100%}
@media (prefers-reduced-motion:reduce){#cap.in,#ctitle{animation:none;opacity:1}}
#mic,#say{position:fixed;right:30px;width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:rgba(12,21,20,.7);color:var(--ink);font-size:1.5rem;cursor:pointer}
#mic{bottom:calc(env(safe-area-inset-bottom,0px) + 226px)}#say{bottom:calc(env(safe-area-inset-bottom,0px) + 294px)}
#mic.off{opacity:.6}#mic.talk{box-shadow:0 0 0 4px var(--moss),0 0 18px var(--moss)}
#err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
</style>

<script>
(() => {
if(!window.THREE){ document.getElementById("err").hidden=false; return; }
/* ================= datos del juego ================= */
const KEY="aprendiz-estrellas-3d-v1", SESSION_MIN=20;
let LANG=(()=>{ try{ const s=JSON.parse(localStorage.getItem(KEY)||"{}"); if(s.lang==="en"||s.lang==="es") return s.lang; }catch(e){} return /^en/i.test(navigator.language||"")?"en":"es"; })();
const EN=LANG==="en", tr=(es,en)=>EN?en:es;
const APP="WarriorMaths";
document.documentElement.lang=LANG;
if(EN){ const set=(sel,t,attr)=>{ const e=document.querySelector(sel); if(e){ if(attr) e.setAttribute(attr,t); else e.textContent=t; } };
  set("#hud .pill small","Honour"); set("#cam","Change camera","aria-label"); set("#camL","Behind"); set("#menu","Menu"); set("#mL","You");
  set("#joy small","Push gently = stealth"); set("#jump","Jump"); set("#mic","Microphone","aria-label"); set("#say","Say to the room","aria-label");
  set("#err p","The 3D world could not be loaded. Check your connection and open the page again."); }
const FURS={gris:{n:tr("Gris","Grey"),b:0x7f858b,d:0x3b4046,l:0xb9bec2},rojizo:{n:tr("Rojizo","Ginger"),b:0xc8742f,d:0x8a4216,l:0xeab27a},negro:{n:tr("Negro","Black"),b:0x26252b,d:0x0d0c10,l:0x3c3a42},
  crema:{n:tr("Crema","Cream"),b:0xdcc29a,d:0xae8a5f,l:0xf2e5cc},marron:{n:tr("Marrón","Brown"),b:0x86663f,d:0x3a2915,l:0xc5a77f},plata:{n:tr("Plata","Silver"),b:0xbfc5cc,d:0x5f6670,l:0xeef0f2},
  azul:{n:tr("Azul humo","Smoky blue"),b:0x7d8597,d:0x4b5163,l:0xb4bac8},canela:{n:tr("Canela","Cinnamon"),b:0xa5683f,d:0x5f341c,l:0xd9a882}};
const PATTERNS={liso:[tr("Liso","Plain"),0],atigrado:[tr("Atigrado","Tabby"),1],moteado:[tr("Moteado","Spotted"),2],carey:[tr("Carey","Tortoiseshell"),3]};
const WHITES={ninguno:[tr("Sin blanco","No white"),0],poco:[tr("Pecho y patas","Chest and paws"),1],mucho:[tr("Manchas blancas","White patches"),2]};
const EYEC={verde:[tr("Verdes","Green"),0x8fcf45],ambar:[tr("Ámbar","Amber"),0xf2a62a],azul:[tr("Azules","Blue"),0x7cc0f2],avellana:[tr("Avellana","Hazel"),0xb39540],cobre:[tr("Cobre","Copper"),0xd8692a],dos:[tr("Dos colores","Two colours"),null]};
const KINDS={fur:[tr("Pelaje","Fur"),FURS],pattern:[tr("Dibujo","Pattern"),PATTERNS],white:[tr("Blanco","White"),WHITES],eyes:[tr("Ojos","Eyes"),EYEC]};
const PRICES={"fur:plata":40,"fur:azul":35,"fur:canela":30,"pattern:carey":45,"white:mucho":30,"eyes:cobre":25,"eyes:dos":50};
const FREE=Object.entries(KINDS).flatMap(([k,[,o]])=>Object.keys(o).map(v=>k+":"+v)).filter(id=>!PRICES[id]);
const L=(fur,pattern,white,eyes)=>({fur,pattern,white,eyes});

const MENTOR=tr("Cola de Pino","Pinetail"), CLAN=tr("Clan del Pinar","Pine Clan");
/* los nombres se guardan en español (clave); en inglés se muestran traducidos */
const PREFIXES=["Niebla","Hoja","Ceniza","Luna","Escarcha","Brezo","Ámbar","Rocío"];
const SUFFIXES=["Corazón","Garra","Cola","Ojo","Salto"];
const PFX_EN={Niebla:"Mist",Hoja:"Leaf",Ceniza:"Ash",Luna:"Moon",Escarcha:"Frost",Brezo:"Heather","Ámbar":"Amber","Rocío":"Dew"};
const SFX_EN={"Corazón":"heart",Garra:"claw",Cola:"tail",Ojo:"eye",Salto:"leap"};
const pawName=p=>EN?(PFX_EN[p]||p)+"paw":`Pata de ${p}`;
const warName=(sfx,p)=>EN?(PFX_EN[p]||p)+(SFX_EN[sfx]||sfx.toLowerCase()):`${sfx} de ${p}`;
const showWarrior=w=>{ if(!EN||!w) return w; const m=String(w).match(/^(\S+) de (.+)$/); return m?warName(m[1],m[2]):w; };
const TERR=["pinar","rio","sierra","viento","niebla"];

/* capítulos: un clan, un territorio, un tema */
const CH=EN?{
  pinar:{clan:"Pine Clan",short:"the Pines",topic:"Multi-step problems",goal:8,leader:"Birchstar",color:"#86b07c",
    champ:{name:"Murkclaw",of:"Mist Clan",look:L("marron","atigrado","poco","ambar")},gift:null,

rio:{

  pesca(){ const t=r2(R(21,39)*.05), s=r2(R(22,48)/10), nt=R(2,5), ns=R(2,4), A=r2(t*nt), B=r2(s*ns), T=r2(A+B), hr=R(2,8);

      ask:[tr("Los kilos de pescado que llevan en total","How many kilos of fish they carry altogether"),tr("Cuánto pesa un salmón","How much one salmon weighs"),tr("Cuántas horas pescaron","How many hours they fished")],

  camino(){ let total,quarter,extra; do{ total=r2(R(6,12)*.4); quarter=r2(total/4); extra=pick([.2,.3,.4,.5]); }while(extra>=quarter);

      ask:[tr("Los km que le faltan para terminar","How many km are left to finish"),tr("Cuántos km recorre por la mañana","How many km it walks in the morning"),tr("Cuántas piedras hay","How many stones there are")],
      steps:[{q:tr("¿Cuántos km recorre por la mañana (3/4 del camino)?","How many km does it walk in the morning (3/4 of the way)?"),ops:["÷","×"],expr:`${fmt(total)} ÷ 4 × 3`,ans:walked,hint:tr("Para 3/4: divide entre 4 y multiplica por 3.","For 3/4: divide by 4 and multiply by 3.")},

  reparto(){ const n=R(3,6), each=r2(R(12,30)/10), total=r2(n*each), eat=r2(R(3,Math.round(each*10)-2)/10), left=r2(each-eat), nu=R(2,6);
    return {title:tr("Pescado para mañana","Fish for Tomorrow"),parts:["",N(n),tr(" gatos se reparten "," cats share "),N(total),tr(" kg de pescado a partes iguales. Cada gato se come "," kg of fish equally. Each cat eats "),N(eat),tr(" kg y guarda el resto para mañana. Desde el agua los miran "," kg and saves the rest for tomorrow. "),N(nu,false),tr(" nutrias. ¿Cuántos kg guarda cada gato?"," otters are watching them from the water. How many kg does each cat save?")],

        {q:tr("¿Cuántos kg guarda cada gato?","How many kg does each cat save?"),ops:["−"],expr:`${fmt(each)} − ${fmt(eat)}`,ans:left,hint:tr("A lo que le toca, quítale lo que se come.","Take what it eats away from what it gets.")}],

  subida(){ const km=r2(R(11,29)/10), m=R(3,19)*50, meta=R(4,6), mKm=Math.round(km*1000), tot=mKm+m, mm=meta*1000, falta=mm-tot;

viento:{
  conejos(){ const k=R(3,6), c1=R(2,5), g1=c1*k, c2=R(4,9), g2=k*c2;
    return {title:tr("Conejos para todos","Rabbits for Everyone"),parts:["",N(c1),tr(" conejos alimentan a "," rabbits feed "),N(g1),tr(" gatos. El Clan del Viento tiene "," cats. Moor Clan has "),N(g2),tr(" gatos y "," cats and "),N(R(3,8),false),tr(" guaridas. ¿Cuántos conejos necesitan para alimentar a todos?"," dens. How many rabbits do they need to feed everyone?")],
      ask:[tr("Cuántos conejos necesitan para todos los gatos","How many rabbits they need for all the cats"),tr("A cuántos gatos alimenta un conejo","How many cats one rabbit feeds"),tr("Cuántas guaridas tienen","How many dens they have")],
      steps:[{q:tr("¿A cuántos gatos alimenta 1 conejo?","How many cats does 1 rabbit feed?"),ops:["÷"],expr:`${g1} ÷ ${c1}`,ans:k,hint:tr("Primero averigua cuánto vale uno: reparte los gatos entre los conejos.","First find out what one rabbit does: share the cats between the rabbits.")},
        {q:tr("¿Cuántos conejos necesitan?","How many rabbits do they need?"),ops:["÷"],expr:`${g2} ÷ ${k}`,ans:c2,hint:tr(`Cada conejo alimenta a ${k} gatos.`,`Each rabbit feeds ${k} cats.`)}],
      finals:[tr(`Necesitan ${c2} conejos.`,`They need ${fmt(c2)} rabbits.`),tr(`Necesitan ${g2} conejos.`,`They need ${fmt(g2)} rabbits.`),tr(`Necesitan ${c2} gatos.`,`They need ${fmt(c2)} cats.`)]}; },
  porcentaje(){ let base,p; do{ base=20*R(3,10); p=pick([5,10,15,20,25,30,40]); }while((base*p)%100);
    const used=base*p/100, left=base-used;
    return {title:tr("Las reservas","The Food Store"),parts:[tr("Antes del invierno, el clan guardó ","Before winter, the clan stored "),N(base),tr(" presas. Durante la primera semana se comió el "," pieces of prey. During the first week they ate "),N(`${p} %`),tr(" de las reservas. Esa semana sopló el viento "," of the store. That week the wind blew on "),N(R(3,6),false),tr(" días. ¿Cuántas presas quedan?"," days. How many pieces of prey are left?")],
      ask:[tr("Cuántas presas quedan","How many pieces of prey are left"),tr("Cuántas presas se comieron","How many pieces of prey they ate"),tr("Cuántos días sopló el viento","How many days the wind blew")],
      steps:[{q:tr(`¿Cuántas presas son el ${p} % de ${base}?`,`How many pieces of prey are ${p}% of ${base}?`),ops:["÷","×"],expr:`${base} ÷ 100 × ${p}`,ans:used,hint:tr(`${p} % significa ${p} de cada 100: divide entre 100 y multiplica por ${p}.`,`${p}% means ${p} out of every 100: divide by 100 and multiply by ${p}.`)},
        {q:tr("¿Cuántas presas quedan?","How many pieces of prey are left?"),ops:["−"],expr:`${base} − ${used}`,ans:left,hint:tr("Quita las que se comieron.","Take away the ones they ate.")}],
      finals:[tr(`Quedan ${left} presas.`,`${fmt(left)} pieces of prey are left.`),tr(`Quedan ${used} presas.`,`${fmt(used)} pieces of prey are left.`),tr(`Quedan ${left} días.`,`${fmt(left)} days are left.`)]}; },
  mapa(){ const esc=pick([20,25,50,100]), a=R(3,9), b=R(2,8), cm=a+b, m=cm*esc;
    return {title:tr("El mapa del páramo","The Moor Map"),parts:[tr("En el mapa del páramo, cada centímetro son ","On the map of the moor, every centimetre is "),N(esc),tr(" m en la realidad. Del campamento a la roca hay "," m in real life. From the camp to the rock it is "),N(a),tr(" cm en el mapa y de la roca al arroyo, "," cm on the map, and from the rock to the stream it is "),N(b),tr(" cm. El mapa mide "," cm. The map is "),N(R(20,40),false),tr(" cm de ancho. ¿Cuántos metros de verdad hay del campamento al arroyo pasando por la roca?"," cm wide. How many real metres is it from the camp to the stream, going past the rock?")],
      ask:[tr("Los metros reales del campamento al arroyo","The real metres from the camp to the stream"),tr("Los centímetros en el mapa","The centimetres on the map"),tr("Cuánto mide el mapa","How wide the map is")],
      steps:[{q:tr("¿Cuántos cm hay en el mapa en total?","How many cm is it on the map altogether?"),ops:["+"],expr:`${a} + ${b}`,ans:cm,hint:tr("Junta los dos tramos.","Put the two parts of the way together.")},
        {q:tr("¿Cuántos metros son en la realidad?","How many metres is that in real life?"),ops:["×"],expr:`${cm} × ${esc}`,ans:m,hint:tr(`Cada cm son ${esc} m.`,`Each cm is ${esc} m.`)}],
      finals:[tr(`Hay ${fmt(m)} m.`,`It is ${fmt(m)} m.`),tr(`Hay ${cm} m.`,`It is ${fmt(cm)} m.`),tr(`Hay ${fmt(m)} cm.`,`It is ${fmt(m)} cm.`)]}; },
  carrera(){ const vl=R(8,12), vg=R(4,vl-2), t=R(5,12), A=vl*t, B=vg*t, d=A-B;
    return {title:tr("La carrera de la liebre","The Hare's Race"),parts:[tr("Una liebre corre ","A hare runs "),N(vl),tr(" metros cada segundo y un gato del Clan del Viento corre "," metres every second and a Moor Clan cat runs "),N(vg),tr(" metros cada segundo. El gato tiene "," metres every second. The cat is "),N(R(5,30),false),tr(" lunas. Si los dos corren durante "," moons old. If they both run for "),N(t),tr(" segundos, ¿cuántos metros de ventaja le saca la liebre?"," seconds, how many metres ahead is the hare?")],
      ask:[tr("Los metros de ventaja de la liebre","How many metres ahead the hare is"),tr("Cuántos metros corre la liebre","How many metres the hare runs"),tr("Cuántas lunas tiene el gato","How many moons old the cat is")],
      steps:[{q:tr("¿Cuántos metros corre la liebre?","How many metres does the hare run?"),ops:["×"],expr:`${vl} × ${t}`,ans:A,hint:tr(`${vl} metros cada segundo, durante ${t} segundos.`,`${vl} metres every second, for ${t} seconds.`)},
        {q:tr("¿Cuántos metros corre el gato?","How many metres does the cat run?"),ops:["×"],expr:`${vg} × ${t}`,ans:B,hint:tr(`${vg} metros cada segundo, durante ${t} segundos.`,`${vg} metres every second, for ${t} seconds.`)},
        {q:tr("¿Cuántos metros de ventaja?","How many metres ahead?"),ops:["−"],expr:`${A} − ${B}`,ans:d,hint:tr("La ventaja es la diferencia.","How far ahead is the difference.")}],
      finals:[tr(`Le saca ${d} m de ventaja.`,`The hare is ${fmt(d)} m ahead.`),tr(`Le saca ${A} m de ventaja.`,`The hare is ${fmt(A)} m ahead.`),tr(`Le saca ${d} segundos de ventaja.`,`The hare is ${fmt(d)} seconds ahead.`)]}; },
  crecer(){ let base,p; do{ base=20*R(2,6); p=pick([5,10,15,20,25,50]); }while((base*p)%100);
    const inc=base*p/100, nw=base+inc;
    return {title:tr("Un clan que crece","A Growing Clan"),parts:[tr("El año pasado el Clan del Viento tenía ","Last year Moor Clan had "),N(base),tr(" gatos. Este año hay un "," cats. This year there are "),N(`${p} %`),tr(" más, porque nacieron cachorros en "," more, because kits were born in "),N(pick([2,3,4]),false),tr(" camadas. ¿Cuántos gatos hay ahora?"," litters. How many cats are there now?")],
      ask:[tr("Cuántos gatos hay ahora","How many cats there are now"),tr("Cuántos gatos nuevos hay","How many new cats there are"),tr("Cuántas camadas nacieron","How many litters were born")],
      steps:[{q:tr(`¿Cuántos gatos son el ${p} % de ${base}?`,`How many cats are ${p}% of ${base}?`),ops:["÷","×"],expr:`${base} ÷ 100 × ${p}`,ans:inc,hint:tr("Divide entre 100 y multiplica por el porcentaje.","Divide by 100 and multiply by the percentage.")},
        {q:tr("¿Cuántos gatos hay ahora?","How many cats are there now?"),ops:["+"],expr:`${base} + ${inc}`,ans:nw,hint:tr("Hay más que antes: suma los nuevos.","There are more than before: add the new ones.")}],
      finals:[tr(`Ahora hay ${nw} gatos.`,`There are now ${fmt(nw)} cats.`),tr(`Ahora hay ${inc} gatos.`,`There are now ${fmt(inc)} cats.`),tr(`Ahora hay ${nw} camadas.`,`There are now ${fmt(nw)} litters.`)]}; }

niebla:{
  temperatura(){ const a=-R(3,9), up=R(5,12), down=R(3,10), m=a+up, n=m-down;
    return {title:tr("Frío en el pantano","Cold in the Marsh"),parts:[tr("Al amanecer, en el pantano hacía ","At dawn, the temperature in the marsh was "),N(a),tr(" °C. A mediodía la temperatura subió "," °C. At midday it went up "),N(up),tr(" grados y por la noche bajó "," degrees and at night it went down "),N(down),tr(" grados. La niebla tapaba "," degrees. The mist was hiding "),N(R(2,6),false),tr(" árboles. ¿Qué temperatura hacía por la noche?"," trees. What was the temperature at night?")],
      ask:[tr("La temperatura de la noche","The temperature at night"),tr("La temperatura de mediodía","The temperature at midday"),tr("Cuántos árboles tapaba la niebla","How many trees the mist was hiding")],
      steps:[{q:tr("¿Qué temperatura hacía a mediodía?","What was the temperature at midday?"),ops:["+"],expr:`${fmt(a)} + ${up}`,ans:m,hint:tr("Subir grados es sumar. Desde un número negativo, avanza hacia el cero.","Going up means adding. From a negative number, move towards zero.")},
        {q:tr("¿Qué temperatura hacía por la noche?","What was the temperature at night?"),ops:["−"],expr:`${fp(m)} − ${down}`,ans:n,hint:tr("Bajar grados es restar. Si pasas del cero, el resultado es negativo.","Going down means taking away. If you go past zero, the answer is negative.")}],
      finals:[tr(`Hacía ${fmt(n)} °C.`,`It was ${fmt(n)} °C.`),tr(`Hacía ${fmt(m)} °C.`,`It was ${fmt(m)} °C.`),tr(`Hacía ${fmt(a+up+down)} °C.`,`It was ${fmt(a+up+down)} °C.`)]}; },
  altura(){ const top=R(2,8), deep=-R(2,6), k=R(1,4), nt=top+k, d=nt-deep;
    return {title:tr("El pájaro y el pez","The Bird and the Fish"),parts:[tr("Un pájaro está posado en una rama a ","A bird is sitting on a branch "),N(top),tr(" m sobre el agua, y un pez nada a "," m above the water, and a fish is swimming at "),N(deep),tr(" m (bajo el agua). El pájaro sube "," m (under the water). The bird flies up "),N(k),tr(" m más. En la orilla croan "," m higher. On the bank, "),N(R(3,9),false),tr(" ranas. ¿Cuántos metros separan ahora al pájaro del pez?"," frogs are croaking. How many metres apart are the bird and the fish now?")],
      ask:[tr("La distancia entre el pájaro y el pez","The distance between the bird and the fish"),tr("A qué altura está ahora el pájaro","How high the bird is now"),tr("Cuántas ranas croan","How many frogs are croaking")],
      steps:[{q:tr("¿A qué altura está ahora el pájaro?","How high is the bird now?"),ops:["+"],expr:`${top} + ${k}`,ans:nt,hint:tr("Sube: suma.","It goes up: add.")},
        {q:tr("¿Cuántos metros los separan?","How many metres apart are they?"),ops:["−"],expr:`${nt} − ${fp(deep)}`,ans:d,hint:tr("La distancia desde arriba hasta abajo del cero: restar un negativo es sumar.","The distance from above zero to below zero: taking away a negative is the same as adding.")}],
      finals:[tr(`Los separan ${d} m.`,`They are ${fmt(d)} m apart.`),tr(`Los separan ${nt+deep} m.`,`They are ${fmt(nt+deep)} m apart.`),tr(`Los separan ${d} °C.`,`They are ${fmt(d)} °C apart.`)]}; },
  ranas(){ let v,m,mx; do{ m=R(4,9); v=[R(1,14),R(1,14),R(1,14)]; v.push(4*m-sum(v)); mx=Math.max(...v); }while(v[3]<1||v[3]>15||mx===m);
    const s=4*m, d=mx-m;
    return {title:tr("Noches de ranas","Frog Nights"),parts:[tr("Una aprendiz de la Niebla cazó ranas durante ","A Mist Clan apprentice hunted frogs for "),N(4),tr(" noches: "," nights: "),N(v[0]),", ",N(v[1]),", ",N(v[2]),tr(" y "," and "),N(v[3]),tr(". Una lechuza ululó ",". An owl hooted "),N(R(2,9),false),tr(" veces. ¿Cuántas ranas más que la media cazó la mejor noche?"," times. On her best night, how many more frogs than the average did she catch?")],
      ask:[tr("Cuántas ranas más que la media cazó la mejor noche","How many more frogs than the average she caught on her best night"),tr("La media de ranas por noche","The average number of frogs per night"),tr("Cuántas veces ululó la lechuza","How many times the owl hooted")],
      steps:[{q:tr("¿Cuántas ranas cazó en total?","How many frogs did she catch altogether?"),ops:["+"],expr:v.join(" + "),ans:s,hint:tr("Para la media, primero suma todo.","To find the average, first add everything up.")},
        {q:tr("¿Cuál es la media por noche?","What is the average per night?"),ops:["÷"],expr:`${s} ÷ 4`,ans:m,hint:tr("Reparte el total entre las 4 noches.","Share the total between the 4 nights.")},
        {q:tr("¿Cuántas más que la media cazó la mejor noche?","On her best night, how many more than the average did she catch?"),ops:["−"],expr:`${mx} − ${m}`,ans:d,hint:tr(`La mejor noche cazó ${mx}. Réstale la media.`,`On her best night she caught ${mx}. Take the average away from that.`)}],
      finals:[tr(`Cazó ${d} ranas más que la media.`,`She caught ${fmt(d)} more frogs than the average.`),tr(`Cazó ${mx} ranas más que la media.`,`She caught ${fmt(mx)} more frogs than the average.`),tr(`Cazó ${d} noches más que la media.`,`She caught ${fmt(d)} more nights than the average.`)]}; },
  rango(){ let t,mx,mn,r,prev; do{ t=[R(-9,8),R(-9,8),R(-9,8),R(-9,8),R(-9,8)]; mx=Math.max(...t); mn=Math.min(...t); r=mx-mn; prev=R(4,15); }while(mn>=0||mx<=0||r<=prev||new Set(t).size<5);
    const d=r-prev;
    return {title:tr("La semana de niebla","The Misty Week"),parts:[tr("Temperaturas de la semana en el pantano: ","This week's temperatures in the marsh: "),N(t[0]),", ",N(t[1]),", ",N(t[2]),", ",N(t[3]),tr(" y "," and "),N(t[4]),tr(" °C. Cantaron "," °C. "),N(R(10,40),false),tr(" grillos cada noche. La semana pasada, la diferencia entre el día más cálido y el más frío fue de "," crickets sang every night. Last week, the difference between the warmest and the coldest day was "),N(prev),tr(" grados. ¿Cuántos grados más de diferencia hubo esta semana?"," degrees. How many more degrees of difference were there this week?")],
      ask:[tr("Cuántos grados más de diferencia hubo esta semana","How many more degrees of difference there were this week"),tr("La temperatura más baja de la semana","The lowest temperature of the week"),tr("Cuántos grillos cantaron","How many crickets sang")],
      steps:[{q:tr("¿Cuál es la diferencia entre el día más cálido y el más frío (el rango)?","What is the difference between the warmest and the coldest day (the range)?"),ops:["−"],expr:`${mx} − ${fp(mn)}`,ans:r,hint:tr(`El más cálido fue ${fmt(mx)} y el más frío ${fmt(mn)}. Restar un negativo es sumar.`,`The warmest was ${fmt(mx)} and the coldest was ${fmt(mn)}. Taking away a negative is the same as adding.`)},
        {q:tr("¿Cuántos grados más que la semana pasada?","How many degrees more than last week?"),ops:["−"],expr:`${r} − ${prev}`,ans:d,hint:tr("Compara las dos diferencias restando.","Compare the two differences by taking one away from the other.")}],
      finals:[tr(`Hubo ${d} grados más de diferencia.`,`There were ${fmt(d)} more degrees of difference.`),tr(`Hubo ${r} grados más de diferencia.`,`There were ${fmt(r)} more degrees of difference.`),tr(`Hubo ${d} días más de diferencia.`,`There were ${fmt(d)} more days of difference.`)]}; },
  mediaFria(){ let v,m; do{ m=-R(1,4); v=[R(-8,3),R(-8,3),R(-8,3)]; v.push(4*m-sum(v)); }while(v[3]<-9||v[3]>5);
    const s=4*m;
    return {title:tr("Noches heladas","Frosty Nights"),parts:[tr("Temperaturas de ","The temperatures on "),N(4),tr(" noches en el pantano: "," nights in the marsh were "),N(v[0]),", ",N(v[1]),", ",N(v[2]),tr(" y "," and "),N(v[3]),tr(" °C. Esas noches durmieron "," °C. On those nights, "),N(R(5,12),false),tr(" gatos en la guarida grande. ¿Cuál fue la temperatura media?"," cats slept in the big den. What was the average temperature?")],
      ask:[tr("La temperatura media de las noches","The average temperature of the nights"),tr("La suma de las temperaturas","The sum of the temperatures"),tr("Cuántos gatos durmieron","How many cats slept")],
      steps:[{q:tr("¿Cuánto suman las cuatro temperaturas?","What do the four temperatures add up to?"),ops:["+"],expr:v.map(fp).join(" + "),ans:s,hint:tr("Suma los positivos y los negativos por separado y luego júntalos.","Add the positives and the negatives separately, then put them together.")},
        {q:tr("¿Cuál es la media?","What is the average?"),ops:["÷"],expr:`${fp(s)} ÷ 4`,ans:m,hint:tr("Reparte la suma entre 4. Negativo entre positivo da negativo.","Share the sum between 4. A negative divided by a positive gives a negative.")}],
      finals:[tr(`La media fue ${fmt(m)} °C.`,`The average was ${fmt(m)} °C.`),tr(`La media fue ${fmt(-m)} °C.`,`The average was ${fmt(-m)} °C.`),tr(`La media fue ${fmt(s)} °C.`,`The average was ${fmt(s)} °C.`)]}; }
}
};

  lunas(){ const ap=R(6,16), k=pick([2,3,4]), lider=ap*k, menos=R(5,lider-ap-2>5?lider-ap-2:5), mentor=lider-menos, sumaMA=mentor+ap;

  const d=await r.json().catch(()=>({})); if(!r.ok){ const e=new Error(d.error||tr("Sin conexión con el servidor.","No connection to the server.")); e.status=r.status; e.data=d; throw e; } return d; }
async function netDetect(){ if(!/^https?:$/.test(location.protocol)||/claude\.ai$|claudeusercontent\.com$/.test(location.hostname)) return false;
  try{ const r=await fetch("/api/health",{cache:"no-store"}); if(!r.ok) return false; const d=await r.json(); NET.api=""; NET.voice=!!d.voice; return true; }catch(e){ return false; } }
const online=()=>NET.api!==null&&!!NET.token;
function setSession(d){ NET.token=d?d.token:null; NET.nick=d?d.nickname:null; NET.code=d?d.code:null;
  try{ if(d){ localStorage.setItem("gatos-token",d.token); localStorage.setItem("gatos-nick",d.nickname); localStorage.setItem("gatos-code",d.code); } else ["gatos-token","gatos-nick","gatos-code"].forEach(k=>localStorage.removeItem(k)); }catch(e){} }
function localWrite(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function adoptServer(st,v){ S=Object.assign(structuredClone(DEF),st); S.__v=v; if(!S.lang) S.lang=LANG; localWrite(); }

/* ---------- sincronización ---------- */
onSaved=()=>{ if(!online()) return; NET.dirty=true; clearTimeout(NET.syncT); NET.syncT=setTimeout(syncNow,5000); };
async function syncNow(keepalive){ if(!online()||NET.syncing||!S.started) return; NET.syncing=true; NET.dirty=false;
  try{ const r=await api("/api/me/save",{method:"PUT",body:JSON.stringify({state:S,version:S.__v||0}),keepalive});
    S.__v=r.version; S.presas=r.state.presas; S.acc=r.state.acc; S.owned=r.state.owned; S.items=r.state.items; localWrite(); NET.lastSync=Date.now(); }
  catch(e){ if(e.status===409&&e.data?.state){ adoptServer(e.data.state,e.data.version); toast(tr("Tu partida se actualizó desde otro dispositivo.","Your game was updated from another device."),"",4000); setTimeout(()=>location.reload(),1500); }
    else if(e.status===401){ setSession(null); toast(tr("Tu sesión ha caducado. Vuelve a entrar con tu código.","Your session has expired. Sign in again with your code."),"warn",6000); }
    else NET.dirty=true; }
  finally{ NET.syncing=false; } }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"&&NET.dirty) syncNow(true); });
setInterval(()=>{ if(NET.dirty&&!NET.syncing) syncNow(); },30000);
async function netStart(){ if(!(await netDetect())||!NET.token) return;
  try{ const r=await api("/api/me/save");
    if(!r.state){ if(S.started) syncNow(); return; }
    if(S.__v===r.version) return;
    if(S.__v===undefined&&S.started){ chooseSave(r); return; }
    if(!S.started||(S.__v||0)<r.version){ adoptServer(r.state,r.version); location.reload(); } }
  catch(e){ if(e.status===401) setSession(null); } }

  openSheet(`<span class="eyebrow">${tr("Tu cuenta","Your account")}</span><h2>${tr("Hay dos partidas","There are two saved games")}</h2><p>${tr("¿Con cuál quieres seguir?","Which one do you want to keep playing?")}</p>
    <button class="btn" id="srv">${tr("La de mi cuenta","The one in my account")}<br><small>${line(a)}</small></button><button class="btn ghost" id="loc">${tr("La de este móvil","The one on this phone")}<br><small>${line(b)}</small></button>
    ${mentorHTML(tr("La otra se perderá. Si dudas, elige la que tenga más honor.","The other one will be lost. If you are not sure, choose the one with more honour."),"warn")}`);
  $("#srv").onclick=()=>{ adoptServer(a,r.version); location.reload(); };
  $("#loc").onclick=async()=>{ S.__v=r.version; closeSheet(); await syncNow(); resume(); }; }

  try{ if(NET.dirty) await syncNow(); const r=await api("/api/me/purchase",{method:"POST",body:JSON.stringify({itemId:id})});
    S.presas=r.presas; apply(); S.__v=r.version; localWrite(); hud(); return true; }
  catch(e){ toast(e.status===undefined?tr("Sin conexión: no se puede comprar ahora.","No connection: you can't buy right now."):e.message,"warn",4000,tr("Urraca","Magpie")); return false; } }

  $("#x").onclick=resume; $("#mic2").onclick=async()=>{ await toggleMic(); roomSheet(); }; $("#lv").onclick=async()=>{ await leaveRoom(); resume(); };

function loadLK(){ return window.LivekitClient?Promise.resolve():new Promise((ok,ko)=>{ const s=document.createElement("script"); s.src="/vendor/livekit-client.umd.js"; s.onload=ok; s.onerror=()=>ko(new Error(tr("No se pudo cargar la voz.","Voice could not be loaded."))); document.head.appendChild(s); }); }
const lkMe=()=>NET.lk?.localParticipant?.identity;
async function lkConnect(url,token){ await loadLK(); const LK=window.LivekitClient;
  const room=new LK.Room({audioCaptureDefaults:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); NET.lk=room; NET.lkReady=false;
  room.on(LK.RoomEvent.TrackSubscribed,(track)=>{ if(track.kind==="audio"){ const el=track.attach(); el.style.display="none"; document.body.appendChild(el); } });
  room.on(LK.RoomEvent.TrackUnsubscribed,(track)=>{ track.detach().forEach(el=>el.remove()); });
  room.on(LK.RoomEvent.ParticipantConnected,p=>{ toast(tr(`${p.name||"Una amiga"} ha entrado en la sala.`,`${p.name||"A friend"} has joined the room.`),"good",3500); });
  room.on(LK.RoomEvent.ParticipantDisconnected,p=>{ dropRemote(p.identity); toast(tr(`${p.name||"Una amiga"} ha salido de la sala.`,`${p.name||"A friend"} has left the room.`),"",3000); });
  room.on(LK.RoomEvent.ActiveSpeakersChanged,sp=>{ NET.speaking=new Set(sp.map(p=>p.identity)); $("#mic").classList.toggle("talk",NET.speaking.has(lkMe())); });
  room.on(LK.RoomEvent.DataReceived,(payload,p)=>{ if(!p) return; let m; try{ m=JSON.parse(new TextDecoder().decode(payload)); }catch(e){ return; } onData(p.identity,p.name,m); });
  room.on(LK.RoomEvent.Disconnected,()=>{ const had=!!NET.room; cleanupRoom(); if(had) toast(tr("Has salido de la sala.","You have left the room."),"",3500); });
  try{ if(!url) throw new Error(tr("Falta LIVEKIT_URL en el servidor.","LIVEKIT_URL is missing on the server."));
    await Promise.race([room.connect(url,token),new Promise((_,ko)=>setTimeout(()=>ko(new Error("timeout")),20000))]); }
  catch(e){ NET.lkErr=String(e&&e.message||e); try{ await room.disconnect(); }catch(_){}
    const code=NET.room?.code; NET.lk=null; NET.room=null; if(code) api(`/api/rooms/${code}/leave`,{method:"POST",body:"{}"}).catch(()=>{});
    throw new Error(tr("No se pudo conectar con el servidor de voz","Could not connect to the voice server")+` (${NET.lkErr}).`); }
  NET.lkErr=null; NET.lkReady=true;
  try{ await room.localParticipant.setMicrophoneEnabled(true); NET.micOn=true; }catch(e){ NET.micOn=false; toast(tr("No se pudo usar el micrófono. Revisa el permiso del navegador.","The microphone could not be used. Check the browser permission."),"warn",5000); }
  $("#mic").hidden=$("#say").hidden=false; updMic(); }
async function toggleMic(){ if(!NET.lk) return; try{ NET.micOn=!NET.micOn; await NET.lk.localParticipant.setMicrophoneEnabled(NET.micOn); }catch(e){ NET.micOn=false; } updMic(); }
function updMic(){ const b=$("#mic"); b.textContent=NET.micOn?"🎙":"🔇"; b.setAttribute("aria-label",NET.micOn?tr("Silenciar micrófono","Mute microphone"):tr("Activar micrófono","Turn on microphone")); b.classList.toggle("off",!NET.micOn); }
async function leaveRoom(){ if(!NET.room) return; const code=NET.room.code; try{ await api(`/api/rooms/${code}/leave`,{method:"POST",body:"{}"}); }catch(e){} try{ await NET.lk?.disconnect(); }catch(e){} cleanupRoom(); }
function cleanupRoom(){ NET.room=null; NET.lk=null; NET.lkReady=false; NET.speaking=new Set(); [...NET.remotes.keys()].forEach(dropRemote); $("#mic").hidden=$("#say").hidden=true; document.querySelectorAll("body>audio").forEach(a=>a.remove()); }
/* só envia com a sala conectada: se o primeiro envio acontecer durante a conexão, o livekit-client 2.5 guarda a falha ("PC manager is closed") e todos os envios seguintes falham */
function send(obj,reliable){ const L=NET.lk; if(!L||!NET.lkReady||L.state!=="connected") return;
  const reset=()=>{ try{ if(L.engine) L.engine.publisherConnectionPromise=undefined; }catch(_){} };
  try{ const pr=L.localParticipant.publishData(new TextEncoder().encode(JSON.stringify(obj)),{reliable:!!reliable}); if(pr&&pr.catch) pr.catch(reset); }catch(e){ reset(); } }

/* ---------- gatas de las amigas ---------- */
function nameTag(text){ const c=document.createElement("canvas"); c.width=256; c.height=64; const g=c.getContext("2d");
  g.font="bold 30px Georgia, serif"; g.textAlign="center"; g.textBaseline="middle"; g.fillStyle="rgba(12,21,20,.65)"; const w=Math.min(250,g.measureText(text).width+28); g.fillRect(128-w/2,8,w,48); g.fillStyle="#f3d68c"; g.fillText(text,128,33);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true})); s.scale.set(1.6,.4,1); s.renderOrder=10; return s; }
function onData(id,name,m){
  if(m.t==="p"){ let r=NET.remotes.get(id);
    if(!r){ const cat=makeCat(m.lk||DEF.look,{shells:0}); scene.add(cat.root); const tag=nameTag(m.n||name||tr("Amiga","Friend")); tag.position.set(0,2,0); cat.root.add(tag);
      const ring=markerSprite(0x9fe0ff); ring.scale.set(1.2,1.2,1); ring.position.set(0,2.45,0); ring.visible=false; cat.root.add(ring);
      r={cat,tag,ring,nick:m.n||name||tr("Amiga","Friend"),lk:"",w:"",x:m.x,z:m.z,ry:m.r,sp:0,si:0,te:m.te,shadow:blob(1.6)}; NET.remotes.set(id,r); cat.root.position.set(m.x,H(m.x,m.z),m.z);
      if(!NET.known.has(id)){ NET.known.add(id); } }
    if(r.te!==m.te||r.teWarn===undefined){ r.teWarn=true; if(m.te!==S.terr&&CH[m.te]) toast(tr(`${esc(r.nick)} está en ${CH[m.te].short}. Para veros, id al mismo territorio (Menú → Mi sala → Ir con ella).`,`${esc(r.nick)} is in ${CH[m.te].short}. To see each other, go to the same territory (Menu → My room → Go to her).`),"",6000,tr("Sala","Room")); }
    r.tx=m.x; r.tz=m.z; r.ry=m.r; r.sp=m.s; r.si=m.si; r.te=m.te; r.seen=performance.now();
    const lk=JSON.stringify(m.lk||{}), w=JSON.stringify(m.w||{}); if(lk!==r.lk){ r.lk=lk; r.cat.setLook(m.lk||DEF.look); } if(w!==r.w){ r.w=w; dress(r.cat,m.w||{}); } }
  else if(m.t==="say"){ const txt=PHRASES[m.i]; if(txt){ toast(`<b>${esc(name||tr("Amiga","Friend"))}:</b> ${txt}`,"good",3500,tr("Sala","Room")); play("blip"); } } }
function dropRemote(id){ const r=NET.remotes.get(id); if(!r) return; disposeCat(r.cat); if(r.shadow) scene.remove(r.shadow); NET.remotes.delete(id); }
function netFrame(dt,t){
  if(NET.lk&&(NET.sendT+=dt)>.1){ NET.sendT=0; const P=player.root.position;
    send({t:"p",x:+P.x.toFixed(2),z:+P.z.toFixed(2),r:+player.root.rotation.y.toFixed(2),te:S.terr,s:+playerSpeed.toFixed(1),si:player.sit>.5?1:0,n:apprentice(),lk:S.look,w:S.wear}); }
  if(NET.room?.host&&(NET.pollT+=dt)>2.5){ NET.pollT=0; api(`/api/rooms/${NET.room.code}`).then(d=>{ const before=NET.room?.pending.length||0; if(!NET.room) return; NET.room.pending=d.pending;
      if(d.pending.length>before) toast(tr(`${esc(d.pending[d.pending.length-1].nick)} quiere entrar en tu sala. Ábrela en Menú → Mi sala.`,`${esc(d.pending[d.pending.length-1].nick)} wants to join your room. Open it in Menu → My room.`),"",6000,tr("Sala","Room")); }).catch(()=>{}); }
  for(const [id,r] of NET.remotes){ const vis=r.te===S.terr&&performance.now()-r.seen<5000; r.cat.root.visible=vis; r.shadow.visible=vis; if(!vis) continue;
    const p=r.cat.root.position, k=Math.min(1,dt*10); p.x+=(r.tx-p.x)*k; p.z+=(r.tz-p.z)*k; p.y=H(p.x,p.z);
    let d=r.ry-r.cat.root.rotation.y; d=Math.atan2(Math.sin(d),Math.cos(d)); r.cat.root.rotation.y+=d*k;
    r.shadow.position.set(p.x,p.y+.03,p.z); r.ring.visible=NET.speaking.has(id); if(r.ring.visible) r.ring.material.opacity=.6+Math.sin(t*10)*.3;
    animateCat(r.cat,dt,r.sp,t,{sit:r.si}); } }
$("#mic").onclick=toggleMic;

let H_=null, MODE=null, huntMouse=null;

const guided=()=>S.hunts<3&&MODE?.type==="hunt";
function newProblem(terr){ let t=terr; const learned=TERR.slice(0,Math.min(S.ch,4)+1);
  if(MODE?.type==="hunt"&&learned.length>1&&Math.random()<.2) t=pick(learned);
  if(!decks[t]||!decks[t].length) decks[t]=shuffle(Object.keys(TPL[t]));
  const id=decks[t].pop(); return Object.assign({id,terr:t},TPL[t][id]()); }
function startProblem(P){ H_={P,stage:0,errors:0,sel:new Set(),step:0,op:null,tries:0,typed:"",results:[],askOpts:shuffle(P.ask.map((t,i)=>({t,ok:i===0}))),finOpts:shuffle(P.finals.map((t,i)=>({t,ok:i===0}))),msg:null}; renderHunt(); }
function stat(k,ok){ S.stats[k][ok?0:1]++; const tp=S.topic[H_.P.terr]; if(tp) tp[ok?0:1]++;
  if(ok) S.honor++; else { H_.errors++; S.byTpl[H_.P.id]=(S.byTpl[H_.P.id]||0)+1; }
  save(); hud(); play(ok?"correct":"wrong"); return MODE?.type==="battle"?battleHit(k,ok):MODE?.type==="rescue"?rescueHit(ok):false; }
function problemHTML(inter){ const strike=MODE?.type==="battle"&&hasR("rastreo");
  return H_.P.parts.map((p,i)=>{ if(typeof p==="string") return esc(p);
    if(!inter) return `<span class="num">${fmt(p.v)}</span>`;
    if(strike&&!p.rel) return `<button class="chip struck" disabled aria-label="${tr("Dato que despista","Distracting number")}">${fmt(p.v)}</button>`;
    return `<button class="chip ${H_.sel.has(i)?"sel":""}" data-i="${i}" aria-pressed="${H_.sel.has(i)}">${fmt(p.v)}</button>`; }).join(""); }
function keypadHTML(){ return `<div class="answer"><div class="disp" id="disp" aria-live="polite">${H_.typed||"&nbsp;"}</div></div>
  <div class="keys">${["7","8","9","⌫","4","5","6","−","1","2","3",DEC].map(k=>`<button class="key" data-key="${k}" aria-label="${k==="⌫"?tr("Borrar","Delete"):k==="−"?tr("Menos","Minus"):k===DEC?tr("Coma decimal","Decimal point"):k}">${k}</button>`).join("")}<button class="key wide" data-key="0">0</button><button class="key wide go" data-key="ok">${tr("Saltar","Leap")}</button></div>`; }
function renderHunt(){ if(!H_) return; const st=H_.stage,P=H_.P; let body="";
  const ref=`<details class="ref"><summary>${tr("Ver el problema","See the problem")}</summary><p class="problem">${problemHTML(false)}</p></details>`;
  const notes=()=>H_.results.length?`<div class="notes">${H_.results.map((r,i)=>`<div><span>${P.steps[i].q}</span><b>${fmt(r)}</b></div>`).join("")}</div>`:"";
  if(st===0) body=`<p class="problem">${problemHTML(false)}</p><h3>${tr("¿Qué nos piden averiguar?","What do we need to find out?")}</h3><div class="opts">${H_.askOpts.map((o,i)=>`<button class="opt" data-a="${i}">${o.t}</button>`).join("")}</div>${H_.msg||(guided()?mentorHTML(tr("Primer movimiento: <b>acechar</b>. Antes de hacer cuentas, un cazador sabe qué presa busca. Lee la última frase con calma.","First move: <b>stalk</b>. Before doing any sums, a hunter knows which prey she is after. Read the last sentence carefully.")):"")}`;
  else if(st===1) body=`<p class="problem">${problemHTML(true)}</p><p>${tr("Toca los números que <b>sirven</b> para responder. Cuidado: hay uno que solo despista.","Tap the numbers that <b>help</b> you answer. Careful: one of them is only there to confuse you.")}</p><button class="btn" id="ok1">${tr("Ya los tengo","Got them")}</button>${H_.msg||(guided()?mentorHTML(tr("Segundo movimiento: <b>olfatear</b>. No todos los olores llevan a la presa. Elige solo los datos útiles.","Second move: <b>sniff</b>. Not every scent leads to the prey. Choose only the useful numbers.")):"")}`;
  else if(st===2){ const s=P.steps[H_.step];
    const help=(["battle","rescue"].includes(MODE?.type)&&MODE.help&&!H_.op?`<button class="btn ghost" id="help">${tr("Pedir ayuda a Lirio","Ask Lily for help")}</button>`:"")+(S.items.baya>0&&!H_.op?`<button class="btn ghost" id="baya">${tr("Usar Baya de pista","Use Clue berry")} (${S.items.baya})</button>`:"");

      :`${H_.tries>=2?`<p class="expr">${s.expr} = ?</p>`:`<p>${tr("Operación","Operation")}: <b class="num">${H_.op}</b></p>`}${keypadHTML()}`}
    ${H_.msg||(guided()&&H_.step===0&&!H_.op?mentorHTML(tr("Tercer movimiento: <b>saltar</b>. Los problemas largos se cazan en varios saltos pequeños. Uno cada vez.","Third move: <b>leap</b>. Long problems are caught in several small leaps. One at a time.")):"")}`; }

  const exit=(EN?{hunt:"Let it go",battle:"Retreat",recruit:"Leave it for later",rescue:""}:{hunt:"Dejarla escapar",battle:"Retirarse",recruit:"Dejarlo para luego",rescue:""})[MODE.type];
  const label2=MODE.type==="recruit"?tr(`Desafío de ${MODE.r.name} · ${MODE.count+1} de 2`,`${MODE.r.name}'s challenge · ${MODE.count+1} of 2`):MODE.type==="rescue"?tr(`Rescate de ${MODE.r.name} · ${MODE.count+1} de 2`,`Rescuing ${MODE.r.name} · ${MODE.count+1} of 2`):P.title;

function swapMentor(html){ const m=sheet.querySelector(".mentor"); if(m) m.outerHTML=html; else sheet.querySelector(".in").insertAdjacentHTML("beforeend",html); }
function pressKey(k){ if(!H_) return; const d=$("#disp"); play("key");

  else if(k==="−") H_.typed=H_.typed.startsWith("−")?H_.typed.slice(1):"−"+H_.typed;
  else if(k===","||k==="."){ if(!/[.,]/.test(H_.typed)) H_.typed+=(H_.typed===""||H_.typed==="−"?"0":"")+DEC; }

  if(d){ d.innerHTML=H_.typed||"&nbsp;"; d.classList.remove("err"); } }
function submitAnswer(){ const P=H_.P, s=P.steps[H_.step], raw=H_.typed.replace(/−/g,"-").replace(/,/g,"."); if(raw===""||raw==="-"||raw==="-."||raw===".") return;
  const v=Number(raw);
  if(Math.abs(v-s.ans)<1e-6){ if(stat("calculo",true)) return; H_.results.push(s.ans); H_.step++; H_.op=null; H_.tries=0; H_.typed="";
    H_.msg=mentorHTML(pick(EN?["Great leap!","That's how you hunt!","Clean and precise.","That's it, keep going."]:["¡Buen salto!","¡Así se caza!","Limpio y preciso.","Eso es, sigue."]),"good"); if(H_.step>=P.steps.length){ H_.stage=3; H_.msg=null; } }
  else { if(stat("calculo",false)) return; H_.tries++; H_.typed="";
    if(H_.tries>=3){ H_.msg=mentorHTML(tr(`Esta era escurridiza: ${s.expr} = <b>${fmt(s.ans)}</b>. Apúntalo y sigamos.`,`That one was slippery: ${s.expr} = <b>${fmt(s.ans)}</b>. Note it down and let's keep going.`),"warn"); H_.results.push(s.ans); H_.step++; H_.op=null; H_.tries=0; if(H_.step>=P.steps.length) H_.stage=3; }
    else H_.msg=mentorHTML(H_.tries===1?tr("Casi. Revisa la cuenta con calma.","Nearly. Check your sum calmly."):tr("Te escribo la operación entera para que la veas.","I'll write out the whole calculation so you can see it."),"warn"); }

  sheet.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; H_.sel.has(i)?H_.sel.delete(i):H_.sel.add(i); b.classList.toggle("sel"); b.setAttribute("aria-pressed",H_.sel.has(i)); });

const SAVE_ID="warriormaths", SAVE_IDS=[SAVE_ID,"aprendiz-estrellas"];
async function saveFile(){ S.savedAt=new Date().toISOString(); save();
  const data=JSON.stringify({game:SAVE_ID,v:1,saved:S.savedAt,S});
  const name=`warriormaths-${(S.prefix||"gata").normalize("NFD").replace(/[^\w]/g,"").toLowerCase()}-${today()}.json`;
  const ok=()=>toast(tr("Partida guardada. Guarda bien el archivo: con él puedes recuperar todo.","Game saved. Keep the file somewhere safe: with it you can get everything back."),"good",5000);
  let dl=null; try{ dl=window.claude?.use?await window.claude.use("downloads"):null; }catch(e){ dl=null; }
  if(dl){ try{ await dl.save({filename:name,data}); ok(); }catch(e){ if(e?.code!=="declined") toast(tr("No se pudo guardar el archivo aquí. Prueba desde el navegador del móvil.","The file couldn't be saved here. Try from your phone's browser."),"warn"); } return; }
  try{ const url=URL.createObjectURL(new Blob([data],{type:"application/json"})); const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),3000); ok(); }
  catch(e){ toast(tr("No se pudo guardar el archivo en este navegador.","The file couldn't be saved in this browser."),"warn"); } }
function cleanSave(s){ const o=Object.assign(structuredClone(DEF),s);

  if(!TERR.includes(o.terr)) o.terr="pinar"; o.ch=Math.max(0,Math.min(5,Number(o.ch)||0));
  ["presas","honor","hunts"].forEach(k=>o[k]=Math.max(0,Number(o[k])||0));
  o.recruits=(Array.isArray(o.recruits)?o.recruits:[]).filter(id=>RECRUITS.some(r=>r.id===id));
  o.owned=(Array.isArray(o.owned)?o.owned:[]).filter(x=>typeof x==="string"); return o; }

    camLook.lerp(lookAt,Math.min(1,dt*12)); camera.lookAt(camLook); }
  else { const top=S.cam==="arriba"; let dist=top?13:6.2, h=top?1.12:pitch;
    if(huntMouse&&huntMouse.state==="frozen"){ dist=top?7:3.6; h=top?.95:.25; lookAt.copy(P).lerp(huntMouse.g.position,.5).add(new THREE.Vector3(0,.5,0)); }
    else if(orb){ dist=8; h=.5; lookAt.copy(P).add(new THREE.Vector3(0,3,0)); }

    else lookAt.copy(P).add(new THREE.Vector3(0,.9,0));
    camTarget.set(P.x+Math.sin(yaw)*dist*Math.cos(h),P.y+1+Math.sin(h)*dist,P.z+Math.cos(yaw)*dist*Math.cos(h));
    const gy=Math.max(H(camTarget.x,camTarget.z),THEME.water??-9)+.6; if(camTarget.y<gy) camTarget.y=gy;
    camera.position.lerp(camTarget,Math.min(1,dt*6)); camLook.lerp(lookAt,Math.min(1,dt*10)); camera.lookAt(camLook); }

let AC=null, master=null;
function audioStart(){ if(AC) return; try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=.55; master.connect(AC.destination); }catch(e){ AC=null; } }
function audioFade(){ if(!AC) return; const t0=AC.currentTime; master.gain.cancelScheduledValues(t0); master.gain.setValueAtTime(master.gain.value,t0); master.gain.linearRampToValueAtTime(0,t0+1.2); const ac=AC; setTimeout(()=>{ try{ ac.close(); }catch(e){} },1500); AC=null; }
const NOTE=n=>440*Math.pow(2,(n-69)/12);
function pad(notes,dur,vol=.05){ if(!AC) return; const t0=AC.currentTime, g=AC.createGain(), f=AC.createBiquadFilter();
  f.type="lowpass"; f.frequency.setValueAtTime(500,t0); f.frequency.linearRampToValueAtTime(1400,t0+dur*.6);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+1.4); g.gain.setValueAtTime(vol,t0+Math.max(1.5,dur-1.2)); g.gain.linearRampToValueAtTime(0,t0+dur+.4);
  f.connect(g); g.connect(master);
  notes.forEach(n=>["sawtooth","triangle"].forEach((type,i)=>{ const o=AC.createOscillator(); o.type=type; o.frequency.value=NOTE(n)*(i?1.004:1); o.connect(f); o.start(t0); o.stop(t0+dur+.5); })); }
function drum(at=0,vol=.8,low=1){ if(!AC) return; const t0=AC.currentTime+at, o=AC.createOscillator(), g=AC.createGain();
  o.type="sine"; o.frequency.setValueAtTime(110*low,t0); o.frequency.exponentialRampToValueAtTime(38*low,t0+.35);
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.001,t0+.55); o.connect(g); g.connect(master); o.start(t0); o.stop(t0+.6);
  const len=AC.sampleRate*.08, b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const ns=AC.createBufferSource(), ng=AC.createGain(); ns.buffer=b; ng.gain.value=vol*.25; ns.connect(ng); ng.connect(master); ns.start(t0); }
function chime(n,at=0,vol=.12){ if(!AC) return; const t0=AC.currentTime+at;
  [1,2.01,3.02].forEach((h,i)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type="sine"; o.frequency.value=NOTE(n)*h;
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol/(i+1),t0+.01); g.gain.exponentialRampToValueAtTime(.0005,t0+2.2); o.connect(g); g.connect(master); o.start(t0); o.stop(t0+2.3); }); }

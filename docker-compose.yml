# Coolify: New Resource → Docker Compose → este archivo. Define las variables en la pestaña "Environment".
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://gatos:${POSTGRES_PASSWORD}@db:5432/gatos
      JWT_SECRET: ${JWT_SECRET}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    depends_on: [db]
    expose: ["3000"]
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gatos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gatos
    volumes:
      - gatos-db:/var/lib/postgresql/data
volumes:
  gatos-db:
